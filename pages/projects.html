<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Projects!</title>
        <link rel="stylesheet" href="../styles.css">
    </head>
    <body>
        
        
        <div id="welcome" class="windows">
            <div class="headers" id="welcomeheader">
                <button class="close-button header-buttons" id="welcome-close">x</button>
                <button class="full-split-buttons header-buttons" id="welcomefull-split"><img src="../window-fullscreen.svg" style="width: 10px; height: 10px;"/></button>
                <button class="minimize-button header-buttons id="welcomeminimize-close">-</button>
            </div>
            <p id="welcome-title">Welcome to estherOS!</p>
            <p id="welcome-paragraph">Hi, my name is Esther and I'm a junior from the Midwest who loves to tinker with technology!<br>
            </p>
        </div>
        <div id="icon-container">
            <div id="welcome-icon" class="app-icons"></div>
            <div id="projects-icon" class="app-icons"></div>
            <div id="interests-icon" class="app-icons"></div>
            <div id="file-explorer-icon" class="app-icons"></div>
            <div id="settings-icon" class="app-icons"></div>
        </div>
        
        
        <footer id="taskbar">
            <div id="time-and-date">
                <div id="time">

                </div>
                <div id="date">
                    
                </div>
            </div>

            
        </footer>
        <script src="./script.js"></script> <!--Make sure to always put the script at the bottom or your code won't work...-->
    </body>
</html>
